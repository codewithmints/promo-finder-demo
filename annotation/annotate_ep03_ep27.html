<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Promo Gold Annotator</title>
<style>
:root{--bg:#f7f6f3;--panel:#fff;--ink:#1d1d1f;--mute:#6b6b70;--line:#e3e1dc;--acc:#3b5bdb;--in:#e8eefc;--hook:#2b8a3e;--cliff:#c92a2a;--warn:#e67700;--chip:#f0efea}
@media (prefers-color-scheme:dark){:root{--bg:#161618;--panel:#1f1f22;--ink:#ececef;--mute:#9a9aa2;--line:#323236;--acc:#7c95ff;--in:#232c46;--hook:#51cf66;--cliff:#ff6b6b;--warn:#ffa94d;--chip:#2a2a2e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}
header{padding:14px 20px;border-bottom:1px solid var(--line);background:var(--panel);display:flex;gap:16px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:5}
h1{font-size:16px;margin:0;font-weight:650}
.tabs button{border:1px solid var(--line);background:var(--chip);color:var(--ink);padding:6px 12px;border-radius:8px;cursor:pointer;margin-right:6px;font-weight:600}
.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.unsaved{color:var(--warn);font-weight:600;font-size:13px}
main{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:16px;padding:16px 20px;max-width:1400px;margin:auto}
@media (max-width:900px){main{grid-template-columns:1fr;padding:12px 16px}aside{position:static!important;max-height:none!important}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.meta p{margin:4px 0;color:var(--mute)} .meta b{color:var(--ink)}
details{margin-top:8px} summary{cursor:pointer;font-weight:600}
details ol{margin:6px 0 0 18px;padding:0;color:var(--mute)}
.block{border-top:1px solid var(--line);padding:6px 0}
.row{display:grid;grid-template-columns:92px minmax(0,1fr) auto;gap:8px;align-items:start;padding:3px 6px;border-radius:6px}
.row.in{background:var(--in)}
.row.hook{box-shadow:inset 3px 0 0 var(--hook)} .row.cliff{box-shadow:inset 3px 0 0 var(--cliff)}
.t{font:12px ui-monospace,Menlo,monospace;color:var(--mute);padding-top:2px}
.cam{color:var(--mute);font-style:italic;font-size:13px}
.cam .sid{font:11px ui-monospace,monospace;font-style:normal;background:var(--chip);padding:1px 5px;border-radius:4px;margin-right:6px}
.who{font-weight:650;font-size:12px;letter-spacing:.02em} .cue{color:var(--mute);font-size:12px}
.trk{font:10px ui-monospace,monospace;text-transform:uppercase;color:var(--mute);margin-right:6px}
.btns{display:flex;gap:3px;white-space:nowrap}
.btns button{font:11px/1 ui-monospace,monospace;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:5px;padding:4px 6px;cursor:pointer}
.btns button:hover{border-color:var(--acc)}
.btns .s.on{background:var(--acc);color:#fff} .btns .e.on{background:var(--acc);color:#fff}
.btns .h.on{background:var(--hook);color:#fff} .btns .c.on{background:var(--cliff);color:#fff}
aside{position:sticky;top:70px;align-self:start;max-height:calc(100vh - 86px);overflow:auto;display:flex;flex-direction:column;gap:12px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:4px 8px;font-size:13px} .kv span:nth-child(odd){color:var(--mute)}
.ok{color:var(--hook);font-weight:600} .bad{color:var(--cliff);font-weight:600}
label{display:block;font-size:12px;color:var(--mute);margin:8px 0 3px}
select,input,textarea{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.primary{width:100%;margin-top:12px;padding:9px;border-radius:8px;border:0;background:var(--acc);color:#fff;font-weight:650;cursor:pointer}
.ghost{padding:6px 10px;border-radius:7px;border:1px solid var(--line);background:var(--chip);color:var(--ink);cursor:pointer;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:12px} td,th{padding:4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.pos{color:var(--hook);font-weight:700} .neg{color:var(--cliff);font-weight:700}
textarea{font:11px ui-monospace,monospace;height:90px}
.hint{font-size:12px;color:var(--mute);margin:6px 0 0}
</style>
</head>
<body>
<header>
  <h1>Promo Gold Annotator</h1>
  <div class="tabs" id="tabs"></div>
  <span class="unsaved" id="unsaved"></span>
</header>
<main>
  <section>
    <div class="card meta" id="meta"></div>
    <div class="card" style="margin-top:12px" id="script"></div>
  </section>
  <aside>
    <div class="card">
      <b>Current selection</b>
      <div class="kv" style="margin-top:8px" id="sel"></div>
      <div class="grid2">
        <div><label>Label</label><select id="f_label"><option value="pos">positive</option><option value="neg">negative</option></select></div>
        <div><label>Quality</label><select id="f_q"><option value="1">1 · must post</option><option value="2">2 · decent</option><option value="3">3 · weak</option></select></div>
        <div><label>Cold viewer gets it?</label><select id="f_cold"><option>Y</option><option>N</option></select></div>
        <div><label>Spoils a payoff?</label><select id="f_sp"><option>N</option><option>Y</option></select></div>
      </div>
      <label>Negative reason (negatives only)</label>
      <select id="f_reason"><option value=""></option><option>weak_hook</option><option>slow_open</option><option>resolved</option><option>needs_context</option><option>confusing</option><option>spoiler</option><option>bad_boundary</option><option>low_emotion</option><option>duplicate</option><option>other</option></select>
      <label>Note (≤10 words, optional)</label><input id="f_note" maxlength="90">
      <button class="primary" id="add">Add promo</button>
      <p class="hint">Click <b>S</b> / <b>E</b> on any row to set start / end. Hook defaults to the first line, cliffhanger to the last; override with <b>H</b> / <b>C</b>.</p>
    </div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center"><b>Saved promos (<span id="n">0</span>)</b>
        <span><button class="ghost" id="dl">Download CSV</button></span></div>
      <table style="margin-top:8px"><thead><tr><th>ID</th><th></th><th>Span</th><th>Dur</th><th>Q</th><th></th></tr></thead><tbody id="list"></tbody></table>
      <label>CSV (copy this if the download is blocked; paste an earlier CSV here and press Import to resume)</label>
      <textarea id="csv"></textarea>
      <div style="display:flex;gap:6px;margin-top:6px"><button class="ghost" id="copy">Copy</button><button class="ghost" id="imp">Import</button></div>
    </div>
  </aside>
</main>
<script>
const DATA = [{"ep": 3, "logline": "Banished from her mother's chapel and seized by guards at her family's command, Juliana is rescued by an imposing, scarred stranger who intervenes with lethal grace\u2014and drops to one knee with a proposal that shocks high society.", "continuity": "Follows directly from Episode 2's confrontation at the altar, where Juliana publicly exposed Gerald's dishonor before the entire aristocratic congregation.", "duration": 145.75, "dur": "02:25.75", "blocks": [{"id": "e03_s000", "t0": 0.0, "t1": 3.5, "ts": "00:00.00", "te": "00:03.50", "text": "Medium shot on Lady Juliana standing abandoned near the altar in her white gown, clutching her mother's medallion to her chest.", "synthetic": false, "canStart": true, "canEnd": false, "lines": [{"id": "e03_u001", "track": "dialogue", "t0": 2.1, "t1": 4.2, "ts": "00:02.10", "te": "00:04.20", "who": "LADY IN GOLD GOWN", "cue": "Mocking, Spiteful", "text": "\"Look at you...\"", "canStart": true, "canEnd": false}]}, {"id": "e03_s001", "t0": 3.5, "t1": 6.1, "ts": "00:03.50", "te": "00:06.10", "text": "Medium shot on the Lady in Gold Gown, smiling smugly in her gold gown beside Gerald.", "synthetic": false, "canStart": false, "canEnd": false, "lines": [{"id": "e03_u003", "track": "dialogue", "t0": 3.6, "t1": 8.2, "ts": "00:03.60", "te": "00:08.20", "who": "LADY IN GOLD GOWN", "cue": "Gloating, Scornful", "text": "\"...still clinging to that little locket as if it can make you worthy of a place here.\"", "canStart": false, "canEnd": true}]}, {"id": "e03_s002", "t0": 6.1, "t1": 8.5, "ts": "00:06.10", "te": "00:08.50", "text": "Close-up profile of Juliana's hand tightly clutching the jeweled silver locket against her breast, tears welling in her eyes.", "synthetic": false, "canStart": false, "canEnd": true, "lines": []}, {"id": "e03_s003", "t0": 8.5, "t1": 11.1, "ts": "00:08.50", "te": "00:11.10", "text": "Medium close-up on Juliana looking across at her sister with wounded pride.", "synthetic": false, "canStart": true, "canEnd": true, "lines": [{"id": "e03_u006", "track": "dialogue", "t0": 8.8, "t1": 10.8, "ts": "00:08.80", "te": "00:10.80", "who": "LADY JULIANA", "cue": "Hurt, Bitter", "text": "\"You stole my wedding.\"", "canStart": true, "canEnd": true}]}, {"id": "e03_s004", "t0": 11.1, "t1": 13.6, "ts": "00:11.10", "te": "00:13.60", "text": "Medium two-shot of Gerald and the Lady in Gold Gown standing together at the front of the nave.", "synthetic": false, "canStart": true, "canEnd": true, "lines": [{"id": "e03_u008", "track": "dialogue", "t0": 11.2, "t1": 13.4, "ts": "00:11.20", "te": "00:13.40", "who": "LADY JULIANA", "cue": "Defiant", "text": "\"Don't pretend you've earned anything.\"", "canStart": true, "canEnd": true}]}, {"id": "e03_s005", "t0": 13.6, "t1": 16.4, "ts": "00:13.60", "te": "00:16.40", "text": "Close-up of the Lady in Gold Gown smirking derisively.", "synthetic": false, "canStart": true, "canEnd": true, "lines": [{"id": "e03_u010", "track": "dialogue", "t0": 13.8, "t1": 16.3, "ts": "00:13.80", "te": "00:16.30", "who": "LADY IN GOLD GOWN", "cue": "Smug, Malicious", "text": "\"I didn't steal what was never truly yours.\"", "canStart": true, "canEnd": true}]}, {"id": "e03_s006", "t0": 16.4, "t1": 18.6, "ts": "00:16.40", "te": "00:18.60", "text": "Close-up on Juliana's trembling lips, refusing to break down.", "synthetic": false, "canStart": true, "canEnd": true, "lines": [{"id": "e03_u012", "track": "dialogue", "t0": 16.6, "t1": 18.4, "ts": "00:16.60", "te": "00:18.40", "who": "LADY JULIANA", "cue": "Trembling, Resolute", "text": "\"This was my wedding.\"", "canStart": true, "canEnd": true}]}, {"id": "e03_s007", "t0": 18.6, "t1": 20.5, "ts": "00:18.60", "te": "00:20.50", "text": "Side medium shot of Gerald looking away impassively as the Lady in Gold Gown leans back against him.", "synthetic": false, "canStart": true, "canEnd": true, "lines": [{"id": "e03_u014", "track": "dialogue", "t0": 18.7, "t1": 20.4, "ts": "00:18.70", "te": "00:20.40", "who": "LADY IN GOLD GOWN", "cue": "Taunting, Cruel", "text": "\"It was supposed to be.\"", "canStart": true, "canEnd": true}]}, {"id": "e03_s008", "t0": 20.5, "t1": 22.8, "ts": "00:20.50", "te": "00:22.80", "text": "Close-up of the Lady in Gold Gown beaming triumphantly.", "synthetic": false, "canStart": true, "canEnd": true, "lines": [{"id": "e03_u016", "track": "dialogue", "t0": 20.6, "t1": 22.5, "ts": "00:20.60", "te": "00:22.50", "who": "LADY IN GOLD GOWN", "cue": "Vindictive", "text": "\"Now it is mine.\"", "canStart": true, "canEnd": true}]}, {"id": "e03_s009", "t0": 22.8, "t1": 25.8, "ts": "00:22.80", "te": "00:25.80", "text": "Low-angle wide shot of an imperious Noble Matriarch in a lavish black velvet gown and jeweled tiara stepping forward.", "synthetic": false, "canStart": true, "canEnd": true, "lines": [{"id": "e03_u018", "track": "dialogue", "t0": 23.1, "t1": 25.5, "ts": "00:23.10", "te": "00:25.50", "who": "NOBLE MATRIARCH", "cue": "Harsh, Authoritative", "text": "\"Enough, Juliana.\"", "canStart": true, "canEnd": true}]}, {"id": "e03_s010", "t0": 25.8, "t1": 28.0, "ts": "00:25.80", "te": "00:28.00", "text": "Medium close-up of the Noble Matriarch glaring down with icy contempt.", "synthetic": false, "canStart": true, "canEnd": true, "lines": [{"id": "e03_u020", "track": "dialogue", "t0": 25.9, "t1": 28.0, "ts": "00:25.90", "te": "00:28.00", "who": "NOBLE MATRIARCH", "cue": "Cold, Disgusted", "text": "\"You have humiliated this family enough for one day.\"", "canStart": true, "canEnd": true}]}, {"id": "e03_s011", "t0": 28.0, "t1": 30.3, "ts": "00:28.00", "te": "00:30.30", "text": "Close-up on Juliana, tears shimmering in her eyes as betrayal strikes deep.", "synthetic": false, "canStart": true, "canEnd": true, "lines": []}, {"id": "e03_s012", "t0": 30.3, "t1": 35.5, "ts": "00:30.30", "te": "00:35.50", "text": "Medium shot on Juliana as she speaks out against her family's injustice.", "synthetic": false, "canStart": true, "canEnd": false, "lines": [{"id": "e03_u023", "track": "dialogue", "t0": 30.4, "t1": 33.2, "ts": "00:30.40", "te": "00:33.20", "who": "LADY JULIANA", "cue": "Pained, Betrayed", "text": "\"I was humiliated by your family.\"", "canStart": true, "canEnd": true}, {"id": "e03_u024", "track": "dialogue", "t0": 33.3, "t1": 35.6, "ts": "00:33.30", "te": "00:35.60", "who": "LADY JULIANA", "cue": "Accusing", "text": "\"And my father said nothing.\"", "canStart": true, "canEnd": true}]}, {"id": "e03_s013", "t0": 35.5, "t1": 38.2, "ts": "00:35.50", "te": "00:38.20", "text": "Medium close-up on the Noble Matriarch, completely unsympathetic.", "synthetic": false, "canStart": false, "canEnd": false, "lines": [{"id": "e03_u026", "track": "dialogue", "t0": 36.5, "t1": 38.4, "ts": "00:36.50", "te": "00:38.40", "who": "NOBLE MATRIARCH", "cue": "Brutal, Dismissive", "text": "\"Your father has made his choice.\"", "canStart": true, "canEnd": true}]}, {"id": "e03_s014", "t0": 38.2, "t1": 40.4, "ts": "00:38.20", "te": "00:40.40", "text": "Close-up on Juliana's stricken, vulnerable face.", "synthetic": false, "canStart": false, "canEnd": true, "lines": [{"id": "e03_u028", "track": "dialogue", "t0": 38.5, "t1": 40.4, "ts": "00:38.50", "te": "00:40.40", "who": "LADY JULIANA", "cue": "Choked, Vulnerable", "text": "\"And what happens to me?\"", "canStart": true, "canEnd": true}]}, {"id": "e03_s015", "t0": 40.4, "t1": 42.0, "ts": "00:40.40", "te": "00:42.00", "text": "Close-up of the Noble Matriarch delivering her verdict.", "synthetic": false, "canStart": true, "canEnd": true, "lines": [{"id": "e03_u030", "track": "dialogue", "t0": 40.5, "t1": 41.9, "ts": "00:40.50", "te": "00:41.90", "who": "NOBLE MATRIARCH", "cue": "Cold, Heartless", "text": "\"You leave.\"", "canStart": true, "canEnd": true}]}, {"id": "e03_s016", "t0": 42.0, "t1": 43.3, "ts": "00:42.00", "te": "00:43.30", "text": "Close-up on Juliana blinking in disbelief.", "synthetic": false, "canStart": true, "canEnd": true, "lines": [{"id": "e03_u032", "track": "dialogue", "t0": 42.1, "t1": 43.3, "ts": "00:42.10", "te": "00:43.30", "who": "LADY JULIANA", "cue": "Disbelieving", "text": "\"Leave where?\"", "canStart": true, "canEnd": true}]}, {"id": "e03_s017", "t0": 43.3, "t1": 45.9, "ts": "00:43.30", "te": "00:45.90", "text": "Medium shot of the Noble Matriarch looking down her nose in disdain.", "synthetic": false, "canStart": true, "canEnd": false, "lines": [{"id": "e03_u034", "track": "dialogue", "t0": 43.4, "t1": 46.0, "ts": "00:43.40", "te": "00:46.00", "who": "NOBLE MATRIARCH", "cue": "Cruel, Scornful", "text": "\"Wherever a discarded daughter belongs.\"", "canStart": true, "canEnd": true}]}, {"id": "e03_s018", "t0": 45.9, "t1": 48.8, "ts": "00:45.90", "te": "00:48.80", "text": "Low-angle close-up focusing on Juliana's neck as her fingers desperately clutch the oval locket.", "synthetic": false, "canStart": false, "canEnd": true, "lines": [{"id": "e03_u036", "track": "dialogue", "t0": 46.4, "t1": 48.6, "ts": "00:46.40", "te": "00:48.60", "who": "LADY JULIANA", "cue": "Fierce, Choked", "text": "\"This is my mother's church.\"", "canStart": true, "canEnd": true}]}, {"id": "e03_s019", "t0": 48.8, "t1": 51.2, "ts": "00:48.80", "te": "00:51.20", "text": "Close-up on Juliana's face, teeth clenched in desperate defiance.", "synthetic": false, "canStart": true, "canEnd": true, "lines": [{"id": "e03_u038", "track": "dialogue", "t0": 48.9, "t1": 51.1, "ts": "00:48.90", "te": "00:51.10", "who": "LADY JULIANA", "cue": "Defiant, Firm", "text": "\"I have every right to stand here.\"", "canStart": true, "canEnd": true}]}, {"id": "e03_s020", "t0": 51.2, "t1": 53.0, "ts": "00:51.20", "te": "00:53.00", "text": "Tight close-up of the Noble Matriarch leaning in with vicious delight.", "synthetic": false, "canStart": true, "canEnd": true, "lines": [{"id": "e03_u040", "track": "dialogue", "t0": 51.3, "t1": 53.0, "ts": "00:51.30", "te": "00:53.00", "who": "NOBLE MATRIARCH", "cue": "Venomous", "text": "\"Not anymore.\"", "canStart": true, "canEnd": true}]}, {"id": "e03_s021", "t0": 53.0, "t1": 56.2, "ts": "00:53.00", "te": "00:56.20", "text": "Medium shot on the Noble Matriarch gesturing expansively to the filled cathedral nave behind her.", "synthetic": false, "canStart": true, "canEnd": false, "lines": [{"id": "e03_u042", "track": "dialogue", "t0": 53.3, "t1": 56.2, "ts": "00:53.30", "te": "00:56.20", "who": "NOBLE MATRIARCH", "cue": "Stern, Final", "text": "\"Your father has chosen his family...\"", "canStart": true, "canEnd": false}]}, {"id": "e03_s022", "t0": 56.2, "t1": 58.2, "ts": "00:56.20", "te": "00:58.20", "text": "Close-up profile of the Noble Matriarch's piercing eyes glaring directly at Juliana.", "synthetic": false, "canStart": false, "canEnd": true, "lines": [{"id": "e03_u044", "track": "dialogue", "t0": 56.3, "t1": 58.2, "ts": "00:56.30", "te": "00:58.20", "who": "NOBLE MATRIARCH", "cue": "Coldly Severing", "text": "\"...and it isn't you.\"", "canStart": false, "canEnd": true}]}, {"id": "e03_s023", "t0": 58.2, "t1": 60.0, "ts": "00:58.20", "te": "01:00.00", "text": "[no camera note \u2014 dialogue/action only]", "synthetic": true, "canStart": true, "canEnd": true, "lines": [{"id": "e03_u045", "track": "action", "t0": 58.2, "t1": 59.8, "ts": "00:58.20", "te": "00:59.80", "who": "", "cue": "", "text": "The Noble Matriarch turns sharply toward the back of the chapel and barks an order.", "canStart": true, "canEnd": false}, {"id": "e03_u046", "track": "dialogue", "t0": 58.3, "t1": 60.0, "ts": "00:58.30", "te": "01:00.00", "who": "NOBLE MATRIARCH", "cue": "Shouting, Imperious", "text": "\"Guards! Remove her!\"", "canStart": true, "canEnd": true}]}, {"id": "e03_s024", "t0": 60.0, "t1": 62.0, "ts": "01:00.00", "te": "01:02.00", "text": "Medium shot as two royal guards in red uniforms and bearskin caps step in behind Juliana and seize her arms.", "synthetic": false, "canStart": true, "canEnd": false, "lines": [{"id": "e03_u048", "track": "action", "t0": 60.5, "t1": 62.5, "ts": "01:00.50", "te": "01 "02:16.20", "who": "", "cue": "", "text": "A collective, stunned gasp rippling across the entire congregation.", "canStart": false, "canEnd": false}]}, {"id": "e03_s060", "t0": 135.5, "t1": 137.3, "ts": "02:15.50", "te": "02:17.30", "text": "Medium shot of the Noble Matriarch, Gerald, and the Lady in Gold Gown frozen in sheer, jaw-dropped bewilderment.", "synthetic": false, "canStart": true, "canEnd": true, "lines": []}, {"id": "e03_s061", "t0": 137.3, "t1": 140.5, "ts": "02:17.30", "te": "02:20.50", "text": "Low-angle medium close-up of The Bearded Stranger on his knee, holding the silver ring high with steady dignity.", "synthetic": false, "canStart": true, "canEnd": true, "lines": [{"id": "e03_u115", "track": "dialogue", "t0": 137.5, "t1": 140.3, "ts": "02:17.50", "te": "02:20.30", "who": "THE BEARDED STRANGER", "cue": "Solemn, Devoted", "text": "\"Lady Juliana... accept my hand.\"", "canStart": true, "canEnd": true}]}, {"id": "e03_s062", "t0": 140.5, "t1": 145.75, "ts": "02:20.50", "te": "02:25.75", "text": "Close-up on Juliana looking down at him, fresh tears trailing down her flushed cheeks as a soft, trembling smile of hope touches her lips into a slow fade.", "synthetic": false, "canStart": true, "canEnd": true, "lines": [{"id": "e03_u117", "track": "action", "t0": 140.5, "t1": 145.75, "ts": "02:20.50", "te": "02:25.75", "who": "", "cue": "", "text": "Juliana gazes down at her rugged savior, overcome with emotion as the swelling score holds on the cliffhanger.", "canStart": true, "canEnd": true}]}]}, {"ep": 27, "logline": "The Dowager Duchess realizes Juliana's wedding ring bears the Ashbourne crest belonging to her lost son, but before Juliana can reveal Alexander's name, Rupert and Catherine storm the bedchamber and frame her for poisoning the Duchess.", "continuity": "Picks up immediately from Episode 26's cliffhanger where the Dowager Duchess gripped Juliana's hand upon recognizing the family signet ring, frantically questioning her origin.", "duration": 150.5, "dur": "02:30.50", "blocks": [{"id": "e27_s000", "t0": 0.0, "t1": 2.1, "ts": "00:00.00", "te": "00:02.10", "text": "Tight close-up of the Dowager Duchess's aged, trembling hands clutching Juliana's hand, examining the worn metal band on her finger.", "synthetic": false, "canStart": true, "canEnd": false, "lines": [{"id": "e27_u001", "track": "dialogue", "t0": 1.3, "t1": 3.2, "ts": "00:01.30", "te": "00:03.20", "who": "DOWAGER DUCHESS", "cue": "Shaken, Breathless", "text": "\"This ring...\"", "canStart": true, "canEnd": true}]}, {"id": "e27_s001", "t0": 2.1, "t1": 5.8, "ts": "00:02.10", "te": "00:05.80", "text": "Low-angle medium close-up of the Dowager Duchess lying propped against her pillows, gripping Juliana's wrist firmly as she gazes up in desperate demand.", "synthetic": false, "canStart": false, "canEnd": true, "lines": [{"id": "e27_u003", "track": "dialogue", "t0": 3.4, "t1": 5.8, "ts": "00:03.40", "te": "00:05.80", "who": "DOWAGER DUCHESS", "cue": "Urgent, Demanding", "text": "\"Look at me, girl. Who gave this to you?\"", "canStart": true, "canEnd": true}]}, {"id": "e27_s002", "t0": 5.8, "t1": 9.4, "ts": "00:05.80", "te": "00:09.40", "text": "Medium shot of Juliana in her maid's apron, startled and anxious as she answers.", "synthetic": false, "canStart": true, "canEnd": true, "lines": [{"id": "e27_u005", "track": "dialogue", "t0": 6.4, "t1": 9.3, "ts": "00:06.40", "te": "00:09.30", "who": "JULIANA", "cue": "Hesitant, Sincere", "text": "\"My husband. He gave it to me when we wed.\"", "canStart": true, "canEnd": true}]}, {"id": "e27_s003", "t0": 9.4, "t1": 13.2, "ts": "00:09.40", "te": "00:13.20", "text": "Low angle on the Dowager Duchess, her eyes burning with intensity.", "synthetic": false, "canStart": true, "canEnd": true, "lines": [{"id": "e27_u007", "track": "dialogue", "t0": 9.7, "t1": 12.8, "ts": "00:09.70", "te": "00:12.80", "who": "DOWAGER DUCHESS", "cue": "Incredulous, Intense", "text": "\"He is no commoner. What does he do?\"", "canStart": true, "canEnd": true}]}, {"id": "e27_s004", "t0": 13.2, "t1": 16.8, "ts": "00:13.20", "te": "00:16.80", "text": "Close-up of Juliana, trying to keep her composure.", "synthetic": false, "canStart": true, "canEnd": true, "lines": [{"id": "e27_u009", "track": "dialogue", "t0": 13.4, "t1": 16.4, "ts": "00:13.40", "te": "00:16.40", "who": "JULIANA", "cue": "Earnest, Defending", "text": "\"He is a soldier. A veteran from the Peninsula.\"", "canStart": true, "canEnd": true}]}, {"id": "e27_s005", "t0": 16.8, "t1": 21.6, "ts": "00:16.80", "te": "00:21.60", "text": "Medium two-shot as the Duchess leans forward slightly, staring at the ring between their joined hands.", "synthetic": false, "canStart": true, "canEnd": true, "lines": [{"id": "e27_u011", "track": "dialogue", "t0": 17.2, "t1": 21.2, "ts": "00:17.20", "te": "00:21.20", "who": "DOWAGER DUCHESS", "cue": "Trembling, Revelatory", "text": "\"That is no ordinary band. It bears the Ashbourne crest.\"", "canStart": true, "canEnd": true}]}, {"id": "e27_s006", "t0": 21.6, "t1": 26.1, "ts": "00:21.60", "te": "00:26.10", "text": "Close-up on Juliana, shaking her head in disbelief and growing confusion.", "synthetic": false, "canStart": true, "canEnd": true, "lines": [{"id": "e27_u013", "track": "dialogue", "t0": 21.8, "t1": 25.8, "ts": "00:21.80", "te": "00:25.80", "who": "JULIANA", "cue": "Confused, Gentle", "text": "\"No. He lives in a barn. He has nothing but his word.\"", "canStart": true, "canEnd": true}]}, {"id": "e27_s007", "t0": 26.1, "t1": 31.8, "ts": "00:26.10", "te": "00:31.80", "text": "Low-angle shot on the Duchess, tears welling in her eyes as grief and shock overtake her.", "synthetic": false, "canStart": true, "canEnd": true, "lines": [{"id": "e27_u015", "track": "dialogue", "t0": 26.6, "t1": 31.4, "ts": "00:26.60", "te": "00:31.40", "who": "DOWAGER DUCHESS", "cue": "Emotionally Strained, Weeping", "text": "\"My lost son wore that exact ring. He went to war...\"", "canStart": true, "canEnd": true}]}, {"id": "e27_s008", "t0": 31.8, "t1": 34.9, "ts": "00:31.80", "te": "00:34.90", "text": "Close-up of Juliana's eyes widening in stunned revelation.", "synthetic": false, "canStart": true, "canEnd": true, "lines": [{"id": "e27_u017", "track": "dialogue", "t0": 32.1, "t1": 34.8, "ts": "00:32.10", "te": "00:34.80", "who": "JULIANA", "cue": "Shocked, Breathless", "text": "\"Your son? He told me he was only a sergeant.\"", "canStart": true, "canEnd": true}]}, {"id": "e27_s009", "t0": 34.9, "t1": 37.4, "ts": "00:34.90", "te": "00:37.40", "text": "Side-angle medium shot of the bed, the Duchess holding onto Juliana's forearm with fierce insistence.", "synthetic": false, "canStart": true, "canEnd": false, "lines": [{"id": "e27_u019", "track": "dialogue", "t0": 35.2, "t1": 37.6, "ts": "00:35.20", "te": "00:37.60", "who": "DOWAGER DUCHESS", "cue": "Desperate, Clinging", "text": "\"My lost son wore that ring!\"", "canStart": true, "canEnd": true}]}, {"id": "e27_s010", "t0": 37.4, "t1": 40.4, "ts": "00:37.40", "te": "00:40.40", "text": "Close-up of Juliana looking down with compassionate concern.", "synthetic": false, "canStart": false, "canEnd": true, "lines": [{"id": "e27_u021", "track": "dialogue", "t0": 37.8, "t1": 40.2, "ts": "00:37.80", "te": "00:40.20", "who": "DOWAGER DUCHESS", "cue": "Pleading, O.S.", "text": "\"Did your husband serve beside him?\"", "canStart": true, "canEnd": true}]}, {"id": "e27_s011", "t0": 40.4, "t1": 44.2, "ts": "00:40.40", "te": "00:44.20", "text": "[no camera note \u2014 dialogue/action only]", "synthetic": true, "canStart": true, "canEnd": true, "lines": [{"id": "e27_u022", "track": "dialogue", "t0": 41.0, "t1": 44.2, "ts": "00:41.00", "te": "00:44.20", "who": "JULIANA", "cue": "Soft, Reverent", "text": "\"He never spoke of his officers. He only spoke of survival.\"", "canStart": true, "canEnd": true}]}, {"id": "e27_s012", "t0": 44.2, "t1": 46.4, "ts": "00:44.20", "te": "00:46.40", "text": "Close-up of the Duchess gazing up at Juliana, her voice barely ue}]}, {"id": "e27_s017", "t0": 55.6, "t1": 58.6, "ts": "00:55.60", "te": "00:58.60", "text": "Medium shot of Juliana standing stiffly beside the bed, concealing her hands.", "synthetic": false, "canStart": true, "canEnd": true, "lines": [{"id": "e27_u032", "track": "dialogue", "t0": 56.8, "t1": 58.4, "ts": "00:56.80", "te": "00:58.40", "who": "JULIANA", "cue": "Calm, Defiant", "text": "\"She needed help.\"", "canStart": true, "canEnd": true}]}, {"id": "e27_s018", "t0": 58.6, "t1": 62.0, "ts": "00:58.60", "te": "01:02.00", "text": "Close-up of Lady Catherine narrowing her eyes with venomous suspicion.", "synthetic": false, "canStart": true, "canEnd": true, "lines": [{"id": "e27_u034", "track": "dialogue", "t0": 60.0, "t1": 61.8, "ts": "01:00.00", "te": "01:01.80", "who": "LADY CATHERINE", "cue": "Piercing, Suspicious", "text": "\"What are you hiding?\"", "canStart": true, "canEnd": true}]}, {"id": "e27_s019", "t0": 62.0, "t1": 64.0, "ts": "01:02.00", "te": "01:04.00", "text": "Close-up of Juliana, her chin raised.", "synthetic": false, "canStart": true, "canEnd": true, "lines": [{"id": "e27_u036", "track": "dialogue", "t0": 62.2, "t1": 63.5, "ts": "01:02.20", "te": "01:03.50", "who": "JULIANA", "cue": "Firm", "text": "\"Nothing.\"", "canStart": true, "canEnd": true}]}, {"id": "e27_s020", "t0": 64.0, "t1": 66.5, "ts": "01:04.00", "te": "01:06.50", "text": "Medium close-up of Lady Catherine pointing a white-gloved finger directly at Juliana.", "synthetic": false, "canStart": true, "canEnd": true, "lines": [{"id": "e27_u038", "track": "dialogue", "t0": 64.8, "t1": 66.4, "ts": "01:04.80", "te": "01:06.40", "who": "LADY CATHERINE", "cue": "Demanding, Harsh", "text": "\"Show me your hand.\"", "canStart": true, "canEnd": true}]}, {"id": "e27_s021", "t0": 66.5, "t1": 70.5, "ts": "01:06.50", "te": "01:10.50", "text": "Medium shot of the Blond Nobleman stepping forward beside Lady Catherine, clad in a dark tailored coat with black leather gloves.", "synthetic": false, "canSta const COLS=["ep","promo_id","label","rank","start_ref","end_ref","start","end","duration_s","hook_ref","hook_time","cliff_ref","cliff_time","quality","cold_ok","spoiler","neg_reason","note"];
let epIdx=0, promos=[], dirty=false;
let cur={start:null,end:null,hook:null,cliff:null};
const $=id=>document.getElementById(id);
const fmt=t=>{const m=Math.floor(t/60),s=(t-m*60);return String(m).padStart(2,"0")+":"+s.toFixed(2).padStart(5,"0")};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const E=()=>DATA[epIdx];
function allLines(){return E().blocks.flatMap(b=>b.lines)}

function tabs(){$("tabs").innerHTML=DATA.map((d,i)=>`<button class="${i===epIdx?"on":""}" data-i="${i}">Episode ${d.ep}</button>`).join("");
  $("tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{epIdx=+b.dataset.i;cur={start:null,end:null,hook:null,cliff:null};render()})}

function meta(){const d=E();$("meta").innerHTML=`<p><b>Episode ${d.ep}</b> · ${d.dur} · ${d.blocks.length} shots</p><p><b>Logline:</b> ${esc(d.logline)}</p><p><b>Continuity:</b> ${esc(d.continuity)}</p>
<details><summary>How to annotate (≈12 min per episode)</summary><ol>
<li>Read the episode once, top to bottom (~3 min).</li>
<li>Find <b>2–4 positives</b>: clips you would actually post. A hook within 3s, an unresolved ending, understandable to a stranger, and no big payoff given away. Add them best first; rank is assigned automatically.</li>
<li>Add <b>1–2 negatives</b>: tempting but bad windows (resolves, needs earlier episodes, spoils, slow start). Pick a reason.</li>
<li>Duration must be 20–60s. Start on a line (not the shot) if the shot opens slowly.</li>
<li>Download the CSV when done. Nothing is saved if you close this tab.</li></ol></details>`}

function btn(kind,ref,t,on,label){return `<button class="${kind} ${on?"on":""}" data-k="${kind}" data-ref="${ref}" data-t="${t}" title="${label}">${kind.toUpperCase()}</button>`}
function inSel(t0,t1){return cur.start&&cur.end&&t0>=cur.start.t-0.01&&t1<=cur.end.t+0.01}
function script(){
  const h=E().blocks.map(b=>{
    const bb=[b.canStart?btn("s",b.id,b.t0,cur.start&&cur.start.ref===b.id,"start here"):"",
              b.canEnd?btn("e",b.id,b.t1,cur.end&&cur.end.ref===b.id,"end here"):"",
              btn("h",b.id,b.t0,cur.hook&&cur.hook.ref===b.id,"hook"),btn("c",b.id,b.t1,cur.cliff&&cur.cliff.ref===b.id,"cliffhanger")].join("");
    const top=`<div class="row ${inSel(b.t0,b.t1)?"in":""} ${cur.hook&&cur.hook.ref===b.id?"hook":""} ${cur.cliff&&cur.cliff.ref===b.id?"cliff":""}"><div class="t">${b.ts}–${b.te}</div><div class="cam"><span class="sid">${b.id.split("_")[1]}</span>${esc(b.text)}</div><div class="btns">${bb}</div></div>`;
    const ls=b.lines.map(l=>{
      const lb=[l.canStart?btn("s",l.id,l.t0,cur.start&&cur.start.ref===l.id,"start here"):"",
                l.canEnd?btn("e",l.id,l.t1,cur.end&&cur.end.ref===l.id,"end here"):"",
                btn("h",l.id,l.t0,cur.hook&&cur.hook.ref===l.id,"hook"),btn("c",l.id,l.t1,cur.cliff&&cur.cliff.ref===l.id,"cliffhanger")].join("");
      const body=l.track==="dialogue"?`<span class="who">${esc(l.who)}</span> <span class="cue">${l.cue?"("+esc(l.cue)+")":""}</span><br>${esc(l.text)}`:`<span class="trk">${l.track}</span>${esc(l.text)}`;
      return `<div class="row ${inSel(l.t0,l.t1)?"in":""} ${cur.hook&&cur.hook.ref===l.id?"hook":""} ${cur.cliff&&cur.cliff.ref===l.id?"cliff":""}"><div class="t">${l.ts}–${l.te}</div><div>${body}</div><div class="btns">${lb}</div></div>`}).join("");
    return `<div class="block">${top}${ls}</div>`}).join("");
  $("script").innerHTML=h;
  $("script").querySelectorAll(".btns button").forEach(x=>x.onclick=()=>{
    const k=x.dataset.k,v={ref:x.dataset.ref,t:+x.dataset.t},key={s:"start",e:"end",h:"hook",c:"cliff"}[k];
    cur[key]=(cur[key]&&cur[key].ref===v.ref)?null:v;
    if(k==="s"||k==="e"){autoHC()} render(false)})
}
function autoHC(){ // default hook = first line at/after start; cliff = last line ending at/before end
  const L=allLines();
  if(cur.start&&(!cur.hook||cur.hook.auto||cur.hook.t<cur.start.t)){const f=L.find(l=>l.t0>=cur.start.t-0.01&&l.track!=="sfx");if(f)cur.hook={ref:f.id,t:f.t0,auto:true}}
  if(cur.end&&(!cur.cliff||cur.cliff.auto||cur.cliff.t>cur.end.t)){const c=[...L].reverse().find(l=>l.t1<=cur.end.t+0.01&&l.track!=="sfx");if(c)cur.cliff={ref:c.id,t:c.t1,auto:true}}
}
function sel(){
  const s=cur.start,e=cur.end,d=s&&e?e.t-s.t:null,hd=s&&cur.hook?cur.hook.t-s.t:null;
  const chk=(c,txt)=>`<span class="${c?"ok":"bad"}">${c?"✓":"✗"} ${txt}</span>`;
  $("sel").innerHTML=`<span>Start</span><span>${s?fmt(s.t)+" · "+s.ref.split("_")[1]:"—"}</span>
  <span>End</span><span>${e?fmt(e.t)+" · "+e.ref.split("_")[1]:"—"}</span>
  <span>Duration</span><span>${d==null?"—":d<=0?chk(false,"end before start"):chk(d>=20&&d<=60,d.toFixed(1)+"s (20–60)")}</span>
  <span>Hook</span><span>${cur.hook?cur.hook.ref.split("_")[1]+" @ "+fmt(cur.hook.t)+(hd!=null?" · "+chk(hd>=-0.01&&hd<=3,"+"+hd.toFixed(1)+"s"):""):"—"}</span>
  <span>Cliffhanger</span><span>${cur.cliff?cur.cliff.ref.split("_")[1]+" @ "+fmt(cur.cliff.t):"—"}</span>`}

function add(){
  const s=cur.start,e=cur.end;
  if(!s||!e||e.t<=s.t){alert("Set a start (S) and an end (E) first.");return}
  const ep=E().ep,lab=$("f_label").value,d=+(e.t-s.t).toFixed(2);
  if(lab==="pos"&&(d<20||d>60)&&!confirm(`Duration ${d}s is outside 20–60s. Save anyway?`))return;
  if(lab==="neg"&&!$("f_reason").value){alert("Pick a negative reason.");return}
  const sameEp=promos.filter(p=>+p.ep===ep);
  const rank=lab==="pos"?sameEp.filter(p=>p.label==="pos").length+1:"";
  promos.push({ep,promo_id:`g${String(ep).padStart(2,"0")}_${String(sameEp.length+1).padStart(2,"0")}`,label:lab,rank,
    start_ref:s.ref,end_ref:e.ref,start:fmt(s.t),end:fmt(e.t),duration_s:d,
    hook_ref:cur.hook?cur.hook.ref:"",hook_time:cur.hook?fmt(cur.hook.t):"",cliff_ref:cur.cliff?cur.cliff.ref:"",cliff_time:cur.cliff?fmt(cur.cliff.t):"",
    quality:$("f_q").value,cold_ok:$("f_cold").value,spoiler:$("f_sp").value,neg_reason:lab==="neg"?$("f_reason").value:"",note:$("f_note").value.trim()});
  cur={start:null,end:null,hook:null,cliff:null};$("f_note").value="";$("f_reason").value="";dirty=true;render(false)}

function toCSV(){const q=v=>{v=String(v??"");return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  return [COLS.join(","),...promos.map(p=>COLS.map(c=>q(p[c])).join(","))].join("\n")}
function parseCSV(t){const rows=[];let r=[],f="",q=false;for(let i=0;i<t.length;i++){const c=t[i];
  if(q){if(c==='"'&&t[i+1]==='"'){f+='"';i++}else if(c==='"')q=false;else f+=c}
  else if(c==='"')q=true;else if(c===","){r.push(f);f=""}else if(c==="\n"){r.push(f);rows.push(r);r=[];f=""}else if(c!=="\r")f+=c}
  if(f||r.length){r.push(f);rows.push(r)}return rows}
function list(){
  $("n").textContent=promos.length;
  $("list").innerHTML=promos.map((p,i)=>`<tr><td>${p.promo_id}</td><td class="${p.label}">${p.label==="pos"?"#"+p.rank:"✗ "+p.neg_reason}</td><td>${p.start}–${p.end}</td><td>${p.duration_s}s</td><td>${p.quality}</td><td><button class="ghost" data-i="${i}" style="padding:2px 6px">✕</button></td></tr>`).join("");
  $("list").querySelectorAll("button").forEach(b=>b.onclick=()=>{promos.splice(+b.dataset.i,1);dirty=true;render(false)});
  $("csv").value=toCSV();
  $("unsaved").textContent=dirty&&promos.length?"● unsaved: download the CSV before closing":"";
}
function render(full=true){if(full){tabs();meta()}script();sel();list()}

$("add").onclick=add;
$("dl").onclick=()=>{const b=new Blob([toCSV()+"\n"],{type:"text/csv"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="gold_"+DATA.map(d=>"ep"+String(d.ep).padStart(2,"0")).join("_")+".csv";document.body.appendChild(a);a.click();a.remove();dirty=false;list()};
$("copy").onclick=()=>{const t=$("csv");t.select();try{navigator.clipboard.writeText(t.value)}catch(e){document.execCommand("copy")}dirty=false;list()};
$("imp").onclick=()=>{const rows=parseCSV($("csv").value.trim());if(rows.length<2||rows[0].join(",")!==COLS.join(",")){alert("Paste a CSV exported from this tool (header row included).");return}
  promos=rows.slice(1).filter(r=>r.length===COLS.length).map(r=>Object.fromEntries(COLS.map((c,i)=>[c,i===0?+r[i]:r[i]])));dirty=false;render(false)};
window.addEventListener("beforeunload",e=>{if(dirty&&promos.length){e.preventDefault();e.returnValue=""}});
render();
</script>
</body>
</html>
