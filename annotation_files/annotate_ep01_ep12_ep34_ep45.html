<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Promo Gold Annotator</title>
<style>
:root{--bg:#f7f6f3;--panel:#fff;--ink:#1d1d1f;--mute:#6b6b70;--line:#e3e1dc;--acc:#3b5bdb;--in:#e8eefc;--hook:#2b8a3e;--cliff:#c92a2a;--warn:#e67700;--chip:#f0efea}
@media (prefers-color-scheme:dark){:root{--bg:#161618;--panel:#1f1f22;--ink:#ececef;--mute:#9a9aa2;--line:#323236;--acc:#7c95ff;--in:#232c46;--hook:#51cf66;--cliff:#ff6b6b;--warn:#ffa94d;--chip:#2a2a2e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}
header{padding:14px 20px;border-bottom:1px solid var(--line);background:var(--panel);display:flex;gap:16px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:5}
h1{font-size:16px;margin:0;font-weight:650}
.tabs button{border:1px solid var(--line);background:var(--chip);color:var(--ink);padding:6px 12px;border-radius:8px;cursor:pointer;margin-right:6px;font-weight:600}
.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.unsaved{color:var(--warn);font-weight:600;font-size:13px}
main{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:16px;padding:16px 20px;max-width:1400px;margin:auto}
@media (max-width:900px){main{grid-template-columns:1fr;padding:12px 16px}aside{position:static!important;max-height:none!important}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.meta p{margin:4px 0;color:var(--mute)} .meta b{color:var(--ink)}
details{margin-top:8px} summary{cursor:pointer;font-weight:600}
details ol{margin:6px 0 0 18px;padding:0;color:var(--mute)}
.block{border-top:1px solid var(--line);padding:6px 0}
.row{display:grid;grid-template-columns:92px minmax(0,1fr) auto;gap:8px;align-items:start;padding:3px 6px;border-radius:6px}
.row.in{background:var(--in)}
.row.hook{box-shadow:inset 3px 0 0 var(--hook)} .row.cliff{box-shadow:inset 3px 0 0 var(--cliff)}
.t{font:12px ui-monospace,Menlo,monospace;color:var(--mute);padding-top:2px}
.cam{color:var(--mute);font-style:italic;font-size:13px}
.cam .sid{font:11px ui-monospace,monospace;font-style:normal;background:var(--chip);padding:1px 5px;border-radius:4px;margin-right:6px}
.who{font-weight:650;font-size:12px;letter-spacing:.02em} .cue{color:var(--mute);font-size:12px}
.trk{font:10px ui-monospace,monospace;text-transform:uppercase;color:var(--mute);margin-right:6px}
.btns{display:flex;gap:3px;white-space:nowrap}
.btns button{font:11px/1 ui-monospace,monospace;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:5px;padding:4px 6px;cursor:pointer}
.btns button:hover{border-color:var(--acc)}
.btns .s.on{background:var(--acc);color:#fff} .btns .e.on{background:var(--acc);color:#fff}
.btns .h.on{background:var(--hook);color:#fff} .btns .c.on{background:var(--cliff);color:#fff}
aside{position:sticky;top:70px;align-self:start;max-height:calc(100vh - 86px);overflow:auto;display:flex;flex-direction:column;gap:12px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:4px 8px;font-size:13px} .kv span:nth-child(odd){color:var(--mute)}
.ok{color:var(--hook);font-weight:600} .bad{color:var(--cliff);font-weight:600}
label{display:block;font-size:12px;color:var(--mute);margin:8px 0 3px}
select,input,textarea{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.primary{width:100%;margin-top:12px;padding:9px;border-radius:8px;border:0;background:var(--acc);color:#fff;font-weight:650;cursor:pointer}
.ghost{padding:6px 10px;border-radius:7px;border:1px solid var(--line);background:var(--chip);color:var(--ink);cursor:pointer;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:12px} td,th{padding:4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.pos{color:var(--hook);font-weight:700} .neg{color:var(--cliff);font-weight:700}
textarea{font:11px ui-monospace,monospace;height:90px}
.hint{font-size:12px;color:var(--mute);margin:6px 0 0}
</style>
</head>
<body>
<header>
  <h1>Promo Gold Annotator</h1>
  <div class="tabs" id="tabs"></div>
  <span class="unsaved" id="unsaved"></span>
</header>
<main>
  <section>
    <div class="card meta" id="meta"></div>
    <div class="card" style="margin-top:12px" id="script"></div>
  </section>
  <aside>
    <div class="card">
      <b>Current selection</b>
      <div class="kv" style="margin-top:8px" id="sel"></div>
      <div class="grid2">
        <div><label>Label</label><select id="f_label"><option value="pos">positive</option><option value="neg">negative</option></select></div>
        <div><label>Quality</label><select id="f_q"><option value="1">1 · must post</option><option value="2">2 · decent</option><option value="3">3 · weak</option></select></div>
        <div><label>Cold viewer gets it?</label><select id="f_cold"><option>Y</option><option>N</option></select></div>
        <div><label>Spoils a payoff?</label><select id="f_sp"><option>N</option><option>Y</option></select></div>
      </div>
      <label>Negative reason (negatives only)</label>
      <select id="f_reason"><option value=""></option><option>weak_hook</option><option>slow_open</option><option>resolved</option><option>needs_context</option><option>confusing</option><option>spoiler</option><option>bad_boundary</option><option>low_emotion</option><option>duplicate</option><option>other</option></select>
      <label>Note (≤10 words, optional)</label><input id="f_note" maxlength="90">
      <button class="primary" id="add">Add promo</button>
      <p class="hint">Click <b>S</b> / <b>E</b> on any row to set start / end. Hook defaults to the first line, cliffhanger to the last; override with <b>H</b> / <b>C</b>.</p>
    </div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center"><b>Saved promos (<span id="n">0</span>)</b>
        <span><button class="ghost" id="dl">Download CSV</button></span></div>
      <table style="margin-top:8px"><thead><tr><th>ID</th><th></th><th>Span</th><th>Dur</th><th>Q</th><th></th></tr></thead><tbody id="list"></tbody></table>
      <label>CSV (copy this if the download is blocked; paste an earlier CSV here and press Import to resume)</label>
      <textarea id="csv"></textarea>
      <div style="display:flex;gap:6px;margin-top:6px"><button class="ghost" id="copy">Copy</button><button class="ghost" id="imp">Import</button></div>
    </div>
  </aside>
</main>
<script>
const DATA = [{"ep": 1, "logline": "Lady Juliana arrives at the cathedral in her late mother's bridal gown, only to suffer the ultimate betrayal when her fianc\u00e9 Gerald abandons her at the altar for her cruel sister Clarissa with her family's full blessing.", "continuity": "First episode of the series. Establishes Juliana's humiliation and abandonment by her betrothed, Gerald, and her noble family in favor of her sister, Clarissa.", "duration": 138.0, "dur": "02:18.00", "blocks": [{"id": "e01_s000", "t0": 0.0, "t1": 4.8, "ts": "00:00.00", "te": "00:04.80", "text": "Symmetrical framing on the heavy church doors as they slowly part, pushing in slightly as Juliana stands framed in the light, dressed in an elegant white silk gown.", "synthetic": false, "canStart": true, "canEnd": true, "lines": [{"id": "e01_u001", "track": "action", "t0": 1.0, "t1": 4.8, "ts": "00:01.00", "te": "00:04.80", "who": "", "cue": "", "text": "Juliana pauses at the threshold, her expression bright with joyful anticipation, wearing her mother's vintage gown and an oval pendant necklace.", "canStart": true, "canEnd": true}]}, {"id": "e01_s001", "t0": 4.8, "t1": 6.8, "ts": "00:04.80", "te": "00:06.80", "text": "High wide tracking shot following behind Juliana as she steps into the grand cathedral nave, facing the distant altar flanked by seated guests.", "synthetic": false, "canStart": true, "canEnd": true, "lines": []}, {"id": "e01_s002", "t0": 6.8, "t1": 9.8, "ts": "00:06.80", "te": "00:09.80", "text": "Close-up on Juliana's face as her warm smile begins to falter into confusion.", "synthetic": false, "canStart": true, "canEnd": true, "lines": [{"id": "e01_u004", "track": "action", "t0": 7.2, "t1": 9.8, "ts": "00:07.20", "te": "00:09.80", "who": "", "cue": "", "text": "Juliana's eyes widen slightly in bewilderment as she notices something amiss at the altar.", "canStart": true, "canEnd": true}]}, {"id": "e01_s003", "t0": 9.8, "t1": 11.0, "ts": "00:09.80", "te": "00:11.00", "text": "Medium profile shot at the altar showing Gerald in his dark tailcoat holding the gloved hand of the Lady in Gold Gown, with Juliana visible walking down the distant aisle.", "synthetic": false, "canStart": true, "canEnd": true, "lines": []}, {"id": "e01_s004", "t0": 11.0, "t1": 13.2, "ts": "00:11.00", "te": "00:13.20", "text": "Medium shot as Juliana stops midway down the aisle, confronted by a haughty matriarch in black velvet stepping into the foreground.", "synthetic": false, "canStart": true, "canEnd": true, "lines": [{"id": "e01_u007", "track": "dialogue", "t0": 11.3, "t1": 13.1, "ts": "00:11.30", "te": "00:13.10", "who": "MATRIARCH", "cue": "Cold, Commanding", "text": "\"You should turn around, Juliana.\"", "canStart": true, "canEnd": true}]}, {"id": "e01_s005", "t0": 13.2, "t1": 14.3, "ts": "00:13.20", "te": "00:14.30", "text": "[no camera note \u2014 dialogue/action only]", "synthetic": true, "canStart": true, "canEnd": true, "lines": [{"id": "e01_u008", "track": "dialogue", "t0": 13.5, "t1": 14.3, "ts": "00:13.50", "te": "00:14.30", "who": "LADY JULIANA", "cue": "Confused, Breathless", "text": "\"Why?\"", "canStart": true, "canEnd": true}]}, {"id": "e01_s006", "t0": 14.3, "t1": 17.8, "ts": "00:14.30", "te": "00:17.80", "text": "Over-the-shoulder medium close-up past the Matriarch to Juliana, looking past her toward the altar.", "synthetic": false, "canStart": true, "canEnd": true, "lines": [{"id": "e01_u010", "track": "dialogue", "t0": 15.5, "t1": 17.5, "ts": "00:15.50", "te": "00:17.50", "who": "LADY JULIANA", "cue": "Desperate, Unbelieving", "text": "\"Gerald is waiting for me.\"", "canStart": true, "canEnd": true}]}, {"id": "e01_s007", "t0": 17.8, "t1": 20.5, "ts": "00:17.80", "te": "00:20.50", "text": "Close-up on the Matriarch wearing an ornate tiara and sapphire jewelry, gazing down with merciless disdain.", "synthetic": false, "canStart": true, "canEnd": true, "lines": [{"id": "e01_u012", "track": "dialogue", "t0": 18.0, "t1": 19.4, "ts": "00:18.00", "te": "00:19.40", "who": "MATRIARCH", "cue": "Blunt, Unforgiving", "text": "\"Not anymore.\"", "canStart": true, "canEnd": true}]}, {"id": "e01_s008", "t0": 20.5, "t1": 23.6, "ts": "00:20.50", "te": "00:23.60", "text": "Close-up on Juliana's stricken face as the weight of the words sinks in.", "synthetic": false, "canStart": true, "canEnd": true, "lines": [{"id": "e01_u014", "track": "dialogue", "t0": 21.8, "t1": 23.5, "ts": "00:21.80", "te": "00:23.50", "who": "LADY JULIANA", "cue": "Trembling, Pleading", "text": "\"What do you mean?\"", "canStart": true, "canEnd": true}]}, {"id": "e01_s009", "t0": 23.6, "t1": 25.8, "ts": "00:23.60", "te": "00:25.80", "text": "Medium shot of the Matriarch gesturing dismissively toward the altar.", "synthetic": false, "canStart": true, "canEnd": true, "lines": [{"id": "e01_u016", "track": "dialogue", "t0": 23.8, "t1": 25.5, "ts": "00:23.80", "te": "00:25.50", "who": "MATRIARCH", "cue": "Dismissive", "text": "\"Look for yourself.\"", "canStart": true, "canEnd": true}, {"id": "e01_u017", "track": "action", "t0": 25.6, "t1": 29.8, "ts": "00:25.60", "te": "00:29.80", "who": "", "cue": "", "text": "Juliana walks forward past the Matriarch, her breath hitching as she approaches the altar steps, looking up in shock.", "canStart": true, "canEnd": true}]}, {"id": "e01_s010", "t0": 25.8, "t1": 29.8, "ts": "00:25.80", "te": "00:29.80", "text": "Medium front tracking shot moving backward ahead of Juliana as she advances down the center aisle.", "synthetic": false, "canStart": true, "canEnd": true, "lines": []}, {"id": "e01_s011", "t0": 29.8, "t1": 32.8, "ts": "00:29.80", "te": "00:32.80", "text": "Panning shot across the seated wedding guests whispering and casting judging glances from the wooden pews.", "synthetic": false, "canStart": true, "canEnd": true, "lines": []}, {"id": "e01_s012", "t0": 32.8, "t1": 33.7, "ts": "00:32.80", "te": "00:33.70", "text": "Low-angle shot from behind Juliana looking up at Gerald and the Lady in Gold Gown standing proudly before the altar.", "synthetic": false, "canStart": true, "canEnd": true, "lines": []}, {"id": "e01_s013", "t0": 33.7, "t1": 35.3, "ts": "00:33.70", "te": "00:35.30", "text": "Close-up on Juliana's trembling lips and shocked, tearful blue eyes.", "synthetic": false, "canStart": true, "canEnd": true, "lines": [{"id": "e01_u022", "track": "dialogue", "t0": 33.8, "t1": 35.0, "ts": "00:33.80", "te": "00:35.00", "who": "LADY JULIANA", "cue": "Shaken, Whispering", "text": "\"Gerald?\"", "canStart": true, "canEnd": true}]}, {"id": "e01_s014", "t0": 35.3, "t1": 36.5, "ts": "00:35.30", "te": "00:36.50", "text": "[no camera note \u2014 dialogue/action only]", "synthetic": true, "canStart": true, "canEnd": false, "lines": [{"id": "e01_u023", "track": "dialogue", "t0": 35.4, "t1": 37.7, "ts": "00:35.40", "te": "00:37.70", "who": "LADY JULIANA", "cue": "Heartbroken", "text": "\"Why are you holding her hand?\"", "canStart": true, "canEnd": true}]}, {"id": "e01_s015", "t0": 36.5, "t1": 39.0, "ts": "00:36.50", "te": "00:39.00", "text": "Close-up insert of Gerald's fingers firmly interlocked with the white-gloved hand of the Lady in Gold Gown.", "synthetic": false, "canStart": false, "canEnd": true, "lines": []}, {"id": "e01_s016", "t0": 39.0, "t1": 41.5, "ts": "00:39.00", "te": "00:41.50", "text": "Close-up on the Lady in Gold Gown beaming with cruel triumph.", "synthetic": false, "canStart": true, "canEnd": true, "lines": [{"id": "e01_u026", "track": "dialogue", "t0": 39.1, "t1": 41.2, "ts": "00:39.10", "te": "00:41.20", "who": "LADY IN GOLD GOWN", "cue": "Gloating, Smug", "text": "\"Because he is marrying me.\"", "canStart": true, "canEnd": true}]}, {"id": "e01_s017", "t0": 41.5, "t1": 43.9, "ts": "00:41.50", "te": "00:43.90", "text": "Close-up on Juliana as tears spill over her eyelashes.", "synthetic": false, "canStart": true, "canEnd": true, "lines": [{"id": "e01_u028", "track": "dialogue", "t0": 41.7, "t1": 43.1, "ts": "00:41.70", "te": "00:43.10", "who": "LADY JULIANA", "cue": "Gasping, Devastated", "text": "\"No...\"", "canStart": true, "canEnd": true}]}, {"id": "e01_s018", "t0": 43.9, "t1": 46.8, "ts": "00:43.90", "te": "00:46.80", "text": "Wide profile shot showing Juliana standing below the altar platform, looking up at Gerald and her sister.", "synthetic": false, "canStart": true, "canEnd": true, "lines": []}, {"id": "e01_s019", "t0": 46.8, "t1": 50.4, "ts": "00:46.80", "te": "00:50.40", "text": "Close-up on Juliana clutching her chest, her sorrow turning into burning outrage.", "synthetic": false, "canStart": true, "canEnd": true, "lines": [{"id": "e01_u031", "track": "dialogue", "t0": 46.8, "t1": 50.0, "ts": "00:46.80", "te": "00:50.00", "who": "LADY JULIANA", "cue": "Outraged, Accusing", "text": "\"You knew this before I walked through those doors!\"", "canStart": true, "canEnd": true}]}, {"id": "e01_s020", "t0": 50.4, "t1": 52.0, "ts": "00:50.40", "te": "00:52.00", "text": "Medium shot of Gerald standing stoic and impassive next to the smug Lady in Gold Gown.", "synthetic": false, "canStart": true, "canEnd": true, "lines": []}, {"id": "e01_s021", "t0": 52.0, "t1": 54.6, "ts": "00:52.00", "te": "00:54.60", "text": "Close-up on Juliana's hands desperately clenching fistfuls of her white dress fabric.", "synthetic": false, "canStart": true, "canEnd": true, "lines": [{"id": "e01_u034", "track": "dialogue", "t0": 52.8, "t1": 54.6, "ts": "00:52.80", "te": "00:54.60", "who": "LADY JULIANA", "cue": "Choking on Tears", "text": "\"You let me come here...\"", "canStart": true, "canEnd": true}]}, {"id": "e01_s022", "t0": 54.6, "t1": 57.6, "ts": "00:54.60", "te": "00:57.60", "text": "Close-up on Juliana's tear-streaked face as she shakes with grief.", "synthetic": false, "canStart": true, "canEnd": false, "lines": [{"id": "e01_u036", "track": "dialogue", "t0": 54.7, "t1": 56.9, "ts": "00:54.70", "te": "00:56.90", "who": "LADY JULIANA", "cue": "Crushed, Shaking", "text": "\"You let me dress in my mother's gown...\"", "canStart": true, " s": "00:32.40", "te": "00:35.30", "text": "Medium close-up of Juliana, her eyes narrowing with sharp perception.", "synthetic": false, "canStart": true, "canEnd": true, "lines": [{"id": "e12_u023", "track": "dialogue", "t0": 32.4, "t1": 35.2, "ts": "00:32.40", "te": "00:35.20", "who": "JULIANA", "cue": "Steely, Resolute", "text": "\"Name your price, Clarissa. I know you.\"", "canStart": true, "canEnd": true}]}, {"id": "e12_s012", "t0": 35.3, "t1": 40.0, "ts": "00:35.30", "te": "00:40.00", "text": "Medium close-up of Clarissa smiling with vicious delight.", "synthetic": false, "canStart": true, "canEnd": true, "lines": [{"id": "e12_u025", "track": "dialogue", "t0": 35.4, "t1": 40.0, "ts": "00:35.40", "te": "00:40.00", "who": "CLARISSA", "cue": "Smooth, Derisive", "text": "\"You always were clever, Juliana. Always searching for some way to escape.\"", "canStart": true, "canEnd": true}]}, {"id": "e12_s013", "t0": 40.0, "t1": 41.8, "ts": "00:40.00", "te": "00:41.80", "text": "Tight shot of Clarissa smoothing her long purple evening glove along her wrist.", "synthetic": false, "canStart": true, "canEnd": true, "lines": [{"id": "e12_u027", "track": "dialogue", "t0": 40.1, "t1": 41.5, "ts": "00:40.10", "te": "00:41.50", "who": "CLARISSA", "cue": "Scheming", "text": "\"Perhaps I can give you one.\"", "canStart": true, "canEnd": true}]}, {"id": "e12_s014", "t0": 41.8, "t1": 43.7, "ts": "00:41.80", "te": "00:43.70", "text": "Close-up of Juliana watching her with cautious skepticism.", "synthetic": false, "canStart": true, "canEnd": true, "lines": [{"id": "e12_u029", "track": "dialogue", "t0": 42.2, "t1": 43.5, "ts": "00:42.20", "te": "00:43.50", "who": "JULIANA", "cue": "Guarded, Cold", "text": "\"What do you want?\"", "canStart": true, "canEnd": true}]}, {"id": "e12_s015", "t0": 43.7, "t1": 46.6, "ts": "00:43.70", "te": "00:46.60", "text": "Medium two-shot of Clarissa in the foreground, turning slowly to face Juliana.", "synthetic": false, "canStart": true, "canEnd": true, "  hands before the magistrate arrives.\"", "canStart": true, "canEnd": true}]}, {"id": "e12_s019", "t0": 60.8, "t1": 63.2, "ts": "01:00.80", "te": "01:03.20", "text": "Medium shot of Gerald tapping his whip against his palm and laughing heartily beside the Constable.", "synthetic": false, "canStart": true, "canEnd": true, "lines": [{"id": "e12_u040", "track": "dialogue", "t0": 60.8, "t1": 63.1, "ts": "01:00.80", "te": "01:03.10", "who": "GERALD", "cue": "Gleeful, Derisive", "text": "\"A lady's hands will be shredded to ribbons!\"", "canStart": true, "canEnd": true}]}, {"id": "e12_s020", "t0": 63.2, "t1": 65.2, "ts": "01:03.20", "te": "01:05.20", "text": "Medium three-shot of Clarissa stepping behind Juliana, as Alexander watches helplessly with dark fury.", "synthetic": false, "canStart": true, "canEnd": true, "lines": [{"id": "e12_u042", "track": "dialogue", "t0": 63.3, "t1": 65.1, "ts": "01:03.30", "te": "01:05.10", "who": "CLARISSA", "cue": "Cold, Transactional", "text": "\"Do it, and we withdraw the charges.\"", "canStart": true, "canEnd": true}]}, {"id": "e12_s021", "t0": 65.2, "t1": 69.5, "ts": "01:05.20", "te": "01:09.50", "text": "Extreme close-up of Clarissa's mouth leaning directly into Juliana's ear, whispering venomously.", "synthetic": false, "canStart": true, "canEnd": true, "lines": [{"id": "e12_u044", "track": "dialogue", "t0": 65.4, "t1": 69.2, "ts": "01:05.40", "te": "01:09.20", "who": "CLARISSA", "cue": "Whispering, Menacing", "text": "\"Fail, or refuse, and your husband hangs from the gallows.\"", "canStart": true, "canEnd": true}]}, {"id": "e12_s022", "t0": 69.5, "t1": 74.0, "ts": "01:09.50", "te": "01:14.00", "text": "Medium close-up of Alexander stepping up beside Juliana, tenderly placing his large hand on her shoulder.", "synthetic": false, "canStart": true, "canEnd": true, "lines": [{"id": "e12_u046", "track": "action", "t0": 69.6, "t1": 71.2, "ts": "01:09.60", "te": "01:11.20", "who": "", "cue": "", "text": "Alexander rests his scarred hand , "ts": "01:24.70", "te": "01:27.21", "who": "", "cue": "", "text": "Juliana locks eyes with Clarissa without flinching as the scene freezes on her brave, sacrificial defiance.", "canStart": true, "canEnd": true}]}]}, {"ep": 34, "logline": "Put on trial for witchcraft and poisoning, Lady Juliana stands proud and defiant in the prisoner's dock, refusing to renounce her mother's herbal medicine even after her coerced maid gives false testimony against her.", "continuity": "Following the aristocratic Lord's ruthless extortion of the young maid in his study, Episode 34 transitions directly into the crowded courtroom trial where the conspirators unleash their manufactured charges and false witnesses against Lady Juliana.", "duration": 190.0, "dur": "03:10.00", "blocks": [{"id": "e34_s000", "t0": 0.0, "t1": 2.8, "ts": "00:00.00", "te": "00:02.80", "text": "High wide establishing shot from behind the presiding judge looking down into the grand, sunlit courtroom filled with stern spectators, armed bailiffs, and Lady Juliana standing confined in the wooden prisoner's dock on the left.", "synthetic": false, "canStart": true, "canEnd": false, "lines": [{"id": "e34_u001", "track": "dialogue", "t0": 1.2, "t1": 7.8, "ts": "00:01.20", "te": "00:07.80", "who": "JUDGE", "cue": "Booming, Authoritative", "text": "\"Lady Juliana Ashcroft, you are accused of witchcraft, unlawful healing, and poisoning.\"", "canStart": true, "canEnd": true}]}, {"id": "e34_s001", "t0": 2.8, "t1": 7.8, "ts": "00:02.80", "te": "00:07.80", "text": "Medium close-up of the stern, elderly Judge seated at the high mahogany bench, resting both hands on the court documents.", "synthetic": false, "canStart": false, "canEnd": true, "lines": []}, {"id": "e34_s002", "t0": 7.8, "t1": 13.1, "ts": "00:07.80", "te": "00:13.10", "text": "Close-up of the charred, ancient botanical grimoire resting on the bench, its scorched pages open to an illustration of a wild rose, as a finger firmly taps the text.", "synthetic": false,  false, "canStart": false, "canEnd": true, "lines": [{"id": "e34_u020", "track": "sfx", "t0": 35.8, "t1": 37.0, "ts": "00:35.80", "te": "00:37.00", "who": "", "cue": "", "text": "[Sharp, echoing crack of the gavel slamming onto wood]", "canStart": false, "canEnd": false}]}, {"id": "e34_s011", "t0": 37.4, "t1": 42.5, "ts": "00:37.40", "te": "00:42.50", "text": "Tracking shot moving from the Judge on his bench as he points his outstretched arm across the courtroom floor toward the witness stand.", "synthetic": false, "canStart": true, "canEnd": true, "lines": [{"id": "e34_u022", "track": "dialogue", "t0": 37.5, "t1": 41.2, "ts": "00:37.50", "te": "00:41.20", "who": "JUDGE", "cue": "Commanding", "text": "\"Prudence. You served beside the accused?\"", "canStart": true, "canEnd": true}, {"id": "e34_u023", "track": "action", "t0": 41.0, "t1": 43.0, "ts": "00:41.00", "te": "00:43.00", "who": "", "cue": "", "text": "Prudence the young maid stands trembling in the center of the courtroom floor, her head bowed in deep shame, clutching the sides of her apron.", "canStart": false, "canEnd": true}]}, {"id": "e34_s012", "t0": 42.5, "t1": 44.8, "ts": "00:42.50", "te": "00:44.80", "text": "Medium close-up of Prudence looking up with tears streaming down her pale face.", "synthetic": false, "canStart": true, "canEnd": true, "lines": [{"id": "e34_u025", "track": "dialogue", "t0": 43.2, "t1": 44.6, "ts": "00:43.20", "te": "00:44.60", "who": "PRUDENCE", "cue": "Trembling, Tearful", "text": "\"Yes, Your Honor.\"", "canStart": true, "canEnd": true}]}, {"id": "e34_s013", "t0": 44.8, "t1": 49.0, "ts": "00:44.80", "te": "00:49.00", "text": "Medium close-up of the Judge leaning forward with folded hands.", "synthetic": false, "canStart": true, "canEnd": true, "lines": [{"id": "e34_u027", "track": "dialogue", "t0": 45.3, "t1": 48.8, "ts": "00:45.30", "te": "00:48.80", "who": "JUDGE", "cue": "Probing, Formal", "text": "\"Did you witness Lady Juliana perform these treatments?\"", "canStart": true, "canEnd": true}]}, {"id": "e34_s014", "t0": 49.0, "t1": 51.5, "ts": "00:49.00", "te": "00:51.50", "text": "Profile over-the-shoulder shot from behind Prudence toward Lady Juliana standing bound in iron cuffs at the prisoner's dock.", "synthetic": false, "canStart": true, "canEnd": true, "lines": [{"id": "e34_u029", "track": "dialogue", "t0": 49.1, "t1": 50.5, "ts": "00:49.10", "te": "00:50.50", "who": "LADY JULIANA", "cue": "Softly, Urgent", "text": "\"Tell the truth.\"", "canStart": true, "canEnd": true}]}, {"id": "e34_s015", "t0": 51.5, "t1": 54.8, "ts": "00:51.50", "te": "00:54.80", "text": "Close-up of Prudence breaking down in tears, squeezing her eyes shut as guilt overwhelms her.", "synthetic": false, "canStart": true, "canEnd": true, "lines": [{"id": "e34_u031", "track": "dialogue", "t0": 53.0, "t1": 54.2, "ts": "00:53.00", "te": "00:54.20", "who": "PRUDENCE", "cue": "Sobbing, Heartbroken", "text": "\"Yes.\"", "canStart": true, "canEnd": true}]}, {"id": "e34_s016", "t0": 54.8, "t1": 57.6, "ts": "00:54.80", "te": "00:57.60", "text": "Close-up of Lady Juliana looking at her former maid, a momentary flicker of hurt passing through her eyes before settling into stoic composure.", "synthetic": false, "canStart": true, "canEnd": true, "lines": []}, {"id": "e34_s017", "t0": 57.6, "t1": 60.8, "ts": "00:57.60", "te": "01:00.80", "text": "Medium profile shot of the Judge recording notes in the open court ledger with a feather quill.", "synthetic": false, "canStart": true, "canEnd": true, "lines": [{"id": "e34_u034", "track": "dialogue", "t0": 58.2, "t1": 60.1, "ts": "00:58.20", "te": "01:00.10", "who": "JUDGE", "cue": "Measured, Stern", "text": "\"What did you see?\"", "canStart": true, "canEnd": true}]}, {"id": "e34_s018", "t0": 60.8, "t1": 64.6, "ts": "01:00.80", "te": "01:04.60", "text": "Medium close-up of Prudence clutching both hands to her chest in anguish.", "synthetic": false, "canStart": true, "canEnd": true, "lines": [{"id": "e34_u036", "track": "dialogue", "t0": 61.3, "t1": 64.4, "ts": "01:01.30", "te": "01:04.40", "who": "PRUDENCE", "cue": "Choked with Tears", "text": "\"She used herbs... and her mother's book.\"", "canStart": true, "canEnd": true}]}, {"id": "e34_s019", "t0": 64.6, "t1": 66.8, "ts": "01:04.60", "te": "01:06.80", "text": "Medium shot of the Judge leaning back slightly, pointing his hand accusingly.", "synthetic": false, "canStart": true, "canEnd": true, "lines": [{"id": "e34_u038", "track": "dialogue", "t0": 64.8, "t1": 66.7, "ts": "01:04.80", "te": "01:06.70", "who": "JUDGE", "cue": "Pressing, Sharp", "text": "\"Did she draw strange markings?\"", "canStart": true, "canEnd": true}]}, {"id": "e34_s020", "t0": 66.8, "t1": 71.8, "ts": "01:06.80", "te": "01:11.80", "text": "Close-up of Prudence's tear-streaked face as she hesitates, her breath hitching.", "synthetic": false, "canStart": true, "canEnd": true, "lines": [{"id": "e34_u040", "track": "dialogue", "t0": 68.2, "t1": 71.7, "ts": "01:08.20", "te": "01:11.70", "who": "PRUDENCE", "cue": "Faltering, Desperate", "text": "\"She... placed herbs around my brother's bed.\"", "canStart": true, "canEnd": true}]}, {"id": "e34_s021", "t0": 71.8, "t1": 75.8, "ts": "01:11.80", "te": "01:15.80", "text": "Medium shot of the Judge pointing an outstretched index finger with piercing intensity.", "synthetic": false, "canStart": true, "canEnd": true, "lines": [{"id": "e34_u042", "track": "dialogue", "t0": 72.1, "t1": 75.5, "ts": "01:12.10", "te": "01:15.50", "who": "JUDGE", "cue": "Accusatory, Forceful", "text": "\"And did she speak words you could not understand?\"", "canStart": true, "canEnd": true}]}, {"id": "e34_s022", "t0": 75.8, "t1": 81.0, "ts": "01:15.80", "te": "01:21.00", "text": "Extreme close-up of Prudence weeping uncontrollably, her face contorted in unbearable remorse.", "synthetic": false, "canStart": true, "canEnd": true, "lines": [{"id": "e34_u044", "track": "dialogue", "t0": 78.8, "t1": 80.5, "ts": "01:18.80", "te": "01:20.50", "who": "PRUDENCE", "cue": "Weeping, Shaken", "text": "\"Yes.\"", "canStart": true, "canEnd": true}]}, {"id": "e34_s023", "t0": 81.0, "t1": 85.2, "ts": "01:21.00", "te": "01:25.20", "text": "Medium tracking shot of the Lord stepping into the open aisle of the courtroom with arms spread wide, turning triumphantly toward the Judge.", "synthetic": false, "canStart": true, "canEnd": true, "lines": [{"id": "e34_u046", "track": "dialogue", "t0": 81.3, "t1": 84.9, "ts": "01:21.30", "te": "01:24.90", "who": "LORD", "cue": "Triumphant, Smug", "text": "\"Your Honor... the witness has confirmed the ritual.\"", "canStart": true, "canEnd": true}, {"id": "e34_u047", "track": "action", "t0": 85.0, "t1": 87.2, "ts": "01:25.00", "te": "01:27.20", "who": "", "cue": "", "text": "Lady Juliana slams her cuffed hands against the wooden railing of the dock, her voice ringing out in indignant fury.", "canStart": true, "canEnd": true}]}, {"id": "e34_s024", "t0": 85.2, "t1": 87.4, "ts": "01:25.20", "te": "01:27.40", "text": "Low-angle medium shot of Lady Juliana gripping the railing, leaning forward.", "synthetic": false, "canStart": true, "canEnd": true, "lines": [{"id": "e34_u049", "track": "dialogue", "t0": 85.2, "t1": 87.2, "ts": "01:25.20", "te": "01:27.20", "who": "LADY JULIANA", "cue": "Passionate, Indignant", "text": "\"It was not a ritual!\"", "canStart": true, "canEnd": true}, {"id": "e34_u050", "track": "action", "t0": 87.2, "t1": 90.2, "ts": "01:27.20", "te": "01:30.20", "who": "", "cue": "", "text": "The Judge repeatedly hammers his gavel down onto the desk, roaring over her.", "canStart": true, "canEnd": true}]}, {"id": "e34_s025", "t0": 87.4, "t1": 90.5, "ts": "01:27.40", "te": "01:30.50", "text": "Medium shot of the Judge striking the wooden block twice in rapid succession.", "synthetic": false, "canStart": true, "canEnd": true, "lines": [{"id": "e34_u052", "track": "sfx", "t0": 87.8, "t1": 89.2, "ts": "01:27.80", "te": "01:29.20", "who": "", "cue": "", "text": "[Violent, resonant double bang of the wooden gavel]", "canStart": false, "canEnd": false}, {"id": "e34_u053", "track": "dialogue", "t0": 87.9, "t1": 90.0, "ts": "01:27.90", "te": "01:30.00", "who": "JUDGE", "cue": "Bellowing", "text": "\"You will speak when addressed!\"", "canStart": true, "canEnd": true}]}, {"id": "e34_s026", "t0": 90.5, "t1": 93.8, "ts": "01:30.50", "te": "01:33.80", "text": "Medium shot of the Lord extending his palm toward the gallery with theatrical composure.", "synthetic": false, "canStart": true, "canEnd": true, "lines": [{"id": "e34_u055", "track": "dialogue", "t0": 91.0, "t1": 93.2, "ts": "01:31.00", "te": "01:33.20", "who": "LORD", "cue": "Calm, Poisonous", "text": "\"We have further witnesses.\"", "canStart": true, "canEnd": true}]}, {"id": "e34_s027", "t0": 93.8, "t1": 98.2, "ts": "01:33.80", "te": "01:38.20", "text": "Medium shot of an anxious townsman standing by the gallery pews, nervously wringing his woolen hat in his hands.", "synthetic": false, "canStart": true, "canEnd": true, "lines": [{"id": "e34_u057", "track": "dialogue", "t0": 94.2, "t1": 98.0, "ts": "01:34.20", "te": "01:38.00", "who": "TOWNSMAN", "cue": "Nervous, Fearful", "text": "\"My wife took one of Lady Juliana's mixtures...\"", "canStart": true, "canEnd": true}]}, {"id": "e34_s028", "t0": 98.2, "t1": 99.5, "ts": "01:38.20", "te": "01:39.50", "text": "Close-up of the Judge glaring down expectantly.", "synthetic": false, "canStart": true, "canEnd": true, "lines": [{"id": "e34_u059", "track": "dialogue", "t0": 98.3, "t1": 99.1, "ts": "01:38.30", "te": "01:39.10", "who": "JUDGE", "cue": "Sharp", "text": "\"And?\"", "canStart": true, "canEnd": true}]}, {"id": "e34_s029", "t0": 99.5, "t1": 102.1, "ts": "01:39.50", "te": "01:42.10", "text": "Close-up of the townsman's face tightening with coached distress.", "synthetic": false, "canStart": true, "canEnd": true, "lines": [{"id": "e34_u061", "track": "dialogue", "t0": 99.8, "t1": 101.8, "ts": "01:39.80", "te": "01:41.80", "who": "TOWNSMAN", "cue": "Agitated", "text": "\"She became violently ill.\"", "canStart": true, "canEnd": true}]}, {"id": "e34_s030", "t0": 102.1, "t1": 107.3, "ts": "01:42.10", "te": "01:47.30", "text": "Medium shot among the spectators as an elderly peasant woman stands up from the wooden bench, pointing an accusatory finger across the courtroom.", "synthetic": false, "canStart": true, "canEnd": true, "lines": [{"id": "e34_u063", "track": "dialogue", "t0": 102.3, "t1": 107.0, "ts": "01:42.30", "te": "01:47.00", "who": "OLD WOMAN", "cue": "Shrill, Accusatory", "text": "\"My daughter drank one of her herbal preparations! She was sick for three days!\"", "canStart": true, "canEnd": true}]}, {"id": "e34_s031", "t0": 107.3, "t1": 110.0, "ts": "01:47.30", "te": "01:50.00", "text": "Side two-shot of the Lord stepping up to the dock, looming beside Lady Juliana as she looks him in the eye.", "synthetic": false, "canStart": true, "canEnd": true, "lines": [{"id": "e34_u065", "track": "dialogue", "t0": 108.0, "t1": 109.8, "ts": "01:48.00", "te": "01:49.80", "who": "LORD", "cue": "Mocking, Smug", "text": "\"She calls it healing.\"", "canStart": true, "canEnd": true}]}, {"id": "e34_s032", "t0": 110.0, "t1": 112.8, "ts": "01:50.00", "te": "01:52.80", "text": "Medium shot of the Lord addressing the courtroom.", "synthetic": false, "canStart": true, "canEnd": true, "lines": [{"id": "e34_u067", "track": "action", "t0": 110.0, "t1": 112.8, "ts": "01:50.00", "te": "01:52.80", "who": "", "cue": "", "text": "The Lord turns dramatically to face the entire assembly, gesturing toward the spectators.", "canStart": true, "canEnd": true}, {"id": "e34_u068", "track": "dialogue", "t0": 110.1, "t1": 112.6, "ts": "01:50.10", "te": "01:52.60", "who": "LORD", "cue": "Resonant, Vindicative", "text": "\"The people call it poisoning!\"", "canStart": true, "canEnd": true}]}, {"id": "e34_s033", "t0": 112.8, "t1": 115.2, "ts": "01:52.80", "te": "01:55.20", "text": "Close-up of Lady Juliana looking past him directly toward the gallery with sharp clarity.", "synthetic": false, "canStart": true, "canEnd": true, "lines": [{"id": "e34_u070", "track": "dialogue", "t0": 113.2, "t1": 115.0, "ts": "01:53.20", "te": "01:55.00", "who": "LADY JULIANA", "cue": "Incisive, Defiant", "text": "\"What were their illnesses?\"", "canStart": true, "canEnd": true}]}, {"id": "e34_s034", "t0": 115.2, "t1": 117.2, "ts": "01:55.20", "te": "01:57.20", "text": "Low-angle close-up of the Lord looking down arrogantly over his shoulder.", "synthetic": false, "canStart": true, "canEnd": true, "lines": [{"id": "e34_u072", "track": "dialogue", "t0": 115.3, "t1": 116.5, "ts": "01:55.30", "te": "01:56.50", "who": "LORD", "cue": "Dismissive", "text": "\"Irrelevant.\"", "canStart": true, "canEnd": true}]}, {"id": "e34_s035", "t0": 117.2, "t1": 119.8, "ts": "01:57.20", "te": "01:59.80", "text": "Close-up of Lady Juliana gritting her teeth in fierce defiance.", "synthetic": false, "canStart": true, "canEnd": true, "lines": [{"id": "e34_u074", "track": "dialogue", "t0": 117.4, "t1": 119.6, "ts": "01:57.40", "te": "01:59.60", "who": "LADY JULIANA", "cue": "Fierce", "text": "\"It is not irrelevant!\"", "canStart": true, "canEnd": true}]}, {"id": "e34_s036", "t0": 119.8, "t1": 123.4, "ts": "01:59.80", "te": "02:03.40", "text": "Low-angle medium shot of Lady Juliana standing tall against the courtroom window light, her chained hands resting on the balustrade as she addresses the entire hall.", "synthetic": false, "canStart": true, "canEnd": true, "lines": [{"id": "e34_u076", "track": "dialogue", "t0": 119.9, "t1": 123.2, "ts": "01:59.90", "te": "02:03.20", "who": "LADY JULIANA", "cue": "Clear, Unyielding", "text": "\"Herbs are not magic! They are medicine!\"", "canStart": true, "canEnd": true}]}, {"id": "e34_s037", "t0": 123.4, "t1": 126.8, "ts": "02:03.40", "te": "02:06.80", "text": "Medium shot of the Judge sitting with steepled fingers upon his high bench.", "synthetic": false, "canStart": true, "canEnd": true, "lines": [{"id": "e34_u const COLS=["ep","promo_id","label","rank","start_ref","end_ref","start","end","duration_s","hook_ref","hook_time","cliff_ref","cliff_time","quality","cold_ok","spoiler","neg_reason","note"];
let epIdx=0, promos=[], dirty=false;
let cur={start:null,end:null,hook:null,cliff:null};
const $=id=>document.getElementById(id);
const fmt=t=>{const m=Math.floor(t/60),s=(t-m*60);return String(m).padStart(2,"0")+":"+s.toFixed(2).padStart(5,"0")};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const E=()=>DATA[epIdx];
function allLines(){return E().blocks.flatMap(b=>b.lines)}

function tabs(){$("tabs").innerHTML=DATA.map((d,i)=>`<button class="${i===epIdx?"on":""}" data-i="${i}">Episode ${d.ep}</button>`).join("");
  $("tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{epIdx=+b.dataset.i;cur={start:null,end:null,hook:null,cliff:null};render()})}

function meta(){const d=E();$("meta").innerHTML=`<p><b>Episode ${d.ep}</b> · ${d.dur} · ${d.blocks.length} shots</p><p><b>Logline:</b> ${esc(d.logline)}</p><p><b>Continuity:</b> ${esc(d.continuity)}</p>
<details><summary>How to annotate (≈12 min per episode)</summary><ol>
<li>Read the episode once, top to bottom (~3 min).</li>
<li>Find <b>2–4 positives</b>: clips you would actually post. A hook within 3s, an unresolved ending, understandable to a stranger, and no big payoff given away. Add them best first; rank is assigned automatically.</li>
<li>Add <b>1–2 negatives</b>: tempting but bad windows (resolves, needs earlier episodes, spoils, slow start). Pick a reason.</li>
<li>Duration must be 20–60s. Start on a line (not the shot) if the shot opens slowly.</li>
<li>Download the CSV when done. Nothing is saved if you close this tab.</li></ol></details>`}

function btn(kind,ref,t,on,label){return `<button class="${kind} ${on?"on":""}" data-k="${kind}" data-ref="${ref}" data-t="${t}" title="${label}">${kind.toUpperCase()}</button>`}
function inSel(t0,t1){return cur.start&&cur.end&&t0>=cur.start.t-0.01&&t1<=cur.end.t+0.01}
function script(){
  const h=E().blocks.map(b=>{
    const bb=[b.canStart?btn("s",b.id,b.t0,cur.start&&cur.start.ref===b.id,"start here"):"",
              b.canEnd?btn("e",b.id,b.t1,cur.end&&cur.end.ref===b.id,"end here"):"",
              btn("h",b.id,b.t0,cur.hook&&cur.hook.ref===b.id,"hook"),btn("c",b.id,b.t1,cur.cliff&&cur.cliff.ref===b.id,"cliffhanger")].join("");
    const top=`<div class="row ${inSel(b.t0,b.t1)?"in":""} ${cur.hook&&cur.hook.ref===b.id?"hook":""} ${cur.cliff&&cur.cliff.ref===b.id?"cliff":""}"><div class="t">${b.ts}–${b.te}</div><div class="cam"><span class="sid">${b.id.split("_")[1]}</span>${esc(b.text)}</div><div class="btns">${bb}</div></div>`;
    const ls=b.lines.map(l=>{
      const lb=[l.canStart?btn("s",l.id,l.t0,cur.start&&cur.start.ref===l.id,"start here"):"",
                l.canEnd?btn("e",l.id,l.t1,cur.end&&cur.end.ref===l.id,"end here"):"",
                btn("h",l.id,l.t0,cur.hook&&cur.hook.ref===l.id,"hook"),btn("c",l.id,l.t1,cur.cliff&&cur.cliff.ref===l.id,"cliffhanger")].join("");
      const body=l.track==="dialogue"?`<span class="who">${esc(l.who)}</span> <span class="cue">${l.cue?"("+esc(l.cue)+")":""}</span><br>${esc(l.text)}`:`<span class="trk">${l.track}</span>${esc(l.text)}`;
      return `<div class="row ${inSel(l.t0,l.t1)?"in":""} ${cur.hook&&cur.hook.ref===l.id?"hook":""} ${cur.cliff&&cur.cliff.ref===l.id?"cliff":""}"><div class="t">${l.ts}–${l.te}</div><div>${body}</div><div class="btns">${lb}</div></div>`}).join("");
    return `<div class="block">${top}${ls}</div>`}).join("");
  $("script").innerHTML=h;
  $("script").querySelectorAll(".btns button").forEach(x=>x.onclick=()=>{
    const k=x.dataset.k,v={ref:x.dataset.ref,t:+x.dataset.t},key={s:"start",e:"end",h:"hook",c:"cliff"}[k];
    cur[key]=(cur[key]&&cur[key].ref===v.ref)?null:v;
    if(k==="s"||k==="e"){autoHC()} render(false)})
}
function autoHC(){ // default hook = first line at/after start; cliff = last line ending at/before end
  const L=allLines();
  if(cur.start&&(!cur.hook||cur.hook.auto||cur.hook.t<cur.start.t)){const f=L.find(l=>l.t0>=cur.start.t-0.01&&l.track!=="sfx");if(f)cur.hook={ref:f.id,t:f.t0,auto:true}}
  if(cur.end&&(!cur.cliff||cur.cliff.auto||cur.cliff.t>cur.end.t)){const c=[...L].reverse().find(l=>l.t1<=cur.end.t+0.01&&l.track!=="sfx");if(c)cur.cliff={ref:c.id,t:c.t1,auto:true}}
}
function sel(){
  const s=cur.start,e=cur.end,d=s&&e?e.t-s.t:null,hd=s&&cur.hook?cur.hook.t-s.t:null;
  const chk=(c,txt)=>`<span class="${c?"ok":"bad"}">${c?"✓":"✗"} ${txt}</span>`;
  $("sel").innerHTML=`<span>Start</span><span>${s?fmt(s.t)+" · "+s.ref.split("_")[1]:"—"}</span>
  <span>End</span><span>${e?fmt(e.t)+" · "+e.ref.split("_")[1]:"—"}</span>
  <span>Duration</span><span>${d==null?"—":d<=0?chk(false,"end before start"):chk(d>=20&&d<=60,d.toFixed(1)+"s (20–60)")}</span>
  <span>Hook</span><span>${cur.hook?cur.hook.ref.split("_")[1]+" @ "+fmt(cur.hook.t)+(hd!=null?" · "+chk(hd>=-0.01&&hd<=3,"+"+hd.toFixed(1)+"s"):""):"—"}</span>
  <span>Cliffhanger</span><span>${cur.cliff?cur.cliff.ref.split("_")[1]+" @ "+fmt(cur.cliff.t):"—"}</span>`}

function add(){
  const s=cur.start,e=cur.end;
  if(!s||!e||e.t<=s.t){alert("Set a start (S) and an end (E) first.");return}
  const ep=E().ep,lab=$("f_label").value,d=+(e.t-s.t).toFixed(2);
  if(lab==="pos"&&(d<20||d>60)&&!confirm(`Duration ${d}s is outside 20–60s. Save anyway?`))return;
  if(lab==="neg"&&!$("f_reason").value){alert("Pick a negative reason.");return}
  const sameEp=promos.filter(p=>+p.ep===ep);
  const rank=lab==="pos"?sameEp.filter(p=>p.label==="pos").length+1:"";
  promos.push({ep,promo_id:`g${String(ep).padStart(2,"0")}_${String(sameEp.length+1).padStart(2,"0")}`,label:lab,rank,
    start_ref:s.ref,end_ref:e.ref,start:fmt(s.t),end:fmt(e.t),duration_s:d,
    hook_ref:cur.hook?cur.hook.ref:"",hook_time:cur.hook?fmt(cur.hook.t):"",cliff_ref:cur.cliff?cur.cliff.ref:"",cliff_time:cur.cliff?fmt(cur.cliff.t):"",
    quality:$("f_q").value,cold_ok:$("f_cold").value,spoiler:$("f_sp").value,neg_reason:lab==="neg"?$("f_reason").value:"",note:$("f_note").value.trim()});
  cur={start:null,end:null,hook:null,cliff:null};$("f_note").value="";$("f_reason").value="";dirty=true;render(false)}

function toCSV(){const q=v=>{v=String(v??"");return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  return [COLS.join(","),...promos.map(p=>COLS.map(c=>q(p[c])).join(","))].join("\n")}
function parseCSV(t){const rows=[];let r=[],f="",q=false;for(let i=0;i<t.length;i++){const c=t[i];
  if(q){if(c==='"'&&t[i+1]==='"'){f+='"';i++}else if(c==='"')q=false;else f+=c}
  else if(c==='"')q=true;else if(c===","){r.push(f);f=""}else if(c==="\n"){r.push(f);rows.push(r);r=[];f=""}else if(c!=="\r")f+=c}
  if(f||r.length){r.push(f);rows.push(r)}return rows}
function list(){
  $("n").textContent=promos.length;
  $("list").innerHTML=promos.map((p,i)=>`<tr><td>${p.promo_id}</td><td class="${p.label}">${p.label==="pos"?"#"+p.rank:"✗ "+p.neg_reason}</td><td>${p.start}–${p.end}</td><td>${p.duration_s}s</td><td>${p.quality}</td><td><button class="ghost" data-i="${i}" style="padding:2px 6px">✕</button></td></tr>`).join("");
  $("list").querySelectorAll("button").forEach(b=>b.onclick=()=>{promos.splice(+b.dataset.i,1);dirty=true;render(false)});
  $("csv").value=toCSV();
  $("unsaved").textContent=dirty&&promos.length?"● unsaved: download the CSV before closing":"";
}
function render(full=true){if(full){tabs();meta()}script();sel();list()}

$("add").onclick=add;
$("dl").onclick=()=>{const b=new Blob([toCSV()+"\n"],{type:"text/csv"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="gold_"+DATA.map(d=>"ep"+String(d.ep).padStart(2,"0")).join("_")+".csv";document.body.appendChild(a);a.click();a.remove();dirty=false;list()};
$("copy").onclick=()=>{const t=$("csv");t.select();try{navigator.clipboard.writeText(t.value)}catch(e){document.execCommand("copy")}dirty=false;list()};
$("imp").onclick=()=>{const rows=parseCSV($("csv").value.trim());if(rows.length<2||rows[0].join(",")!==COLS.join(",")){alert("Paste a CSV exported from this tool (header row included).");return}
  promos=rows.slice(1).filter(r=>r.length===COLS.length).map(r=>Object.fromEntries(COLS.map((c,i)=>[c,i===0?+r[i]:r[i]])));dirty=false;render(false)};
window.addEventListener("beforeunload",e=>{if(dirty&&promos.length){e.preventDefault();e.returnValue=""}});
render();
</script>
</body>
</html>
